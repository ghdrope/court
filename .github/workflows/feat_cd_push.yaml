name: Feat CD Push

on:
  push:
    branches-ignore:
      - main
      - '*.*.*-rc*'
      - development
    paths:
      - 'charts/**/*'
      - '.github/workflows/feat_cd_push.yaml'

permissions: {}

jobs:
  feat-ci-push:
    uses: ghdrope/templates-ci/.github/workflows/helm-feat_cd_push.yml@latest
    permissions:
      contents: read
