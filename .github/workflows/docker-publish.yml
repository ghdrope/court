name: Docker Publish

on:
  push:
    branches:
      - '*.*.*-rc*'
    tags:
      - '*.*.*'

permissions: {}

jobs:
  docker-publish:
    uses: ghdrope/templates-ci/.github/workflows/docker-docker_publish.yml@main
    with:
      components: '["officer", "court"]'
    permissions:
      contents: read
      packages: write